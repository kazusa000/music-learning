[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "music-learning"
version = "0.1.0"
description = "Local AI-operated music project service"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
music-learning = "music_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/app.in"]}

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]
markers = ["integration: uses downloaded third-party VST3 plugins"]
